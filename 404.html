<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>nanana</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: pointer;
        }

        video {
            max-width: 90vw;
            max-height: 90vh;
            display: none;
        }
    </style>
</head>
<body>

<video
    id="player"
    loop
    playsinline
>
    <source id="videoSource" type="video/mp4">
</video>

<script>
    const fullPath = window.location.pathname.replace(/\/+$/, "").toLowerCase();
    const path = fullPath.replace(/^\/-/, "") || "/";

    const videos = {
        "/": "s.mp4",
        "/ralsei": "s.mp4",
        "/multifandom": "multifandom.mp4",
        "/hyperbaiter": "https://github.com/xyrevex/-/releases/download/a/HYPERBAITER.mp4",
        "/gerson": "gerson.mov",
        "/guitar": "Guitar.mp4",
        "/badapple": "badapple.mp4",
        "/macaron": "https://github.com/xyrevex/-/releases/download/Macoron/LiarMacoron.mp4"
    };

    const video = document.getElementById("player");
    const source = document.getElementById("videoSource");

    source.src = videos[path] || "s.mp4";

    let started = false;

    document.body.addEventListener("click", () => {
        if (started) return;
        started = true;

        video.style.display = "block";
        video.muted = false;
        video.volume = 1;

        video.load();
        video.play();
    }, { once: true });
</script>

</body>
</html>
