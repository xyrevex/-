<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>my very tuff sigma video lobby</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { color-scheme: dark; }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 35%),
                linear-gradient(180deg, #111 0%, #090909 100%);
            color: #f3f3f3;
            font-family: Arial, Helvetica, sans-serif;
        }

        .wrap {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
            padding: 40px 0 56px;
        }

        .hero {
            margin-bottom: 28px;
            padding: 22px 24px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.28);
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 4vw, 44px);
            line-height: 1;
            letter-spacing: -0.03em;
        }

        .hero p {
            margin: 0;
            color: #bdbdbd;
            font-size: 15px;
            line-height: 1.5;
            max-width: 720px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: end;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .topbar h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .count {
            color: #9d9d9d;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px;
        }

        .card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: rgba(255,255,255,0.045);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 14px;
            transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.16);
        }

        .thumb {
            aspect-ratio: 16 / 9;
            width: 100%;
            border-radius: 11px;
            background: #181818;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            text-align: center;
            color: #aaa;
            font-size: 14px;
            word-break: break-word;
        }

        .name {
            margin-top: 11px;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.25;
        }

        .path {
            margin-top: 5px;
            font-size: 12px;
            color: #9d9d9d;
            word-break: break-all;
        }

        .footer {
            margin-top: 28px;
            color: #787878;
            font-size: 13px;
        }

        @media (max-width: 560px) {
            .wrap {
                width: min(100% - 20px, 1100px);
                padding-top: 20px;
                padding-bottom: 28px;
            }

            .hero {
                padding: 18px;
                border-radius: 14px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <section class="hero">
            <h1>super sigma lobby</h1>
            <p>shitty ass lobby</p>
        </section>

        <div class="topbar">
            <h2>videos</h2>
            <div class="count" id="videoCount"></div>
        </div>

        <div class="grid" id="videoGrid"></div>

        <div class="footer">pls works</div>
    </div>

<script>
    const videos = [

        ["ayla1", "ayla1"],

        ["mahiro", "mahiro"],
        ["DJ Melon - Neck Hurts", "djmelon"]
        
    ];

    const grid = document.getElementById("videoGrid");
    const count = document.getElementById("videoCount");
    const origin = window.location.origin + "/-/";

    count.textContent = `${videos.length} video${videos.length === 1 ? "" : "s"}`;

    for (const [name, route] of videos) {
        const href = origin + route;

        const card = document.createElement("a");
        card.className = "card";
        card.href = href;
        card.target = "_blank";
        card.rel = "noopener noreferrer";

        card.innerHTML = `
            <div class="thumb">${name}</div>
            <div class="name">${name}</div>
            <div class="path">${href}</div>
        `;

        grid.appendChild(card);
    }
</script>
</body>
</html>
