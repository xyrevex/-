            color: inherit;

            padding: 14px;

        .card:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.16);
        }

        .thumb {
            aspect-ratio: 16 / 9;
            width: 100%;
            border-radius: 11px;
            background: #181818;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);

        .preview {

for (const [key, value] of entries) {
    const card = document.createElement("a");
    const name = key.replace(/^\//, "");

    const route = routes[key] || key;
    const href = origin + route.replace(/^\//, "");

    const previewSrc = /^https?:\/\//i.test(value)
        ? value
        : origin + value;

    card.className = "card";
    card.href = href;
    card.target = "_blank";
    card.rel = "noopener noreferrer";

    const preview = card.querySelector(".preview");

    card.addEventListener("mouseenter", () => {
        if (activePreview && activePreview !== preview) {
            stopPreview(activePreview, true);
        }

        if (preview.dataset.loaded !== "1") {
            preview.src = preview.dataset.src;
            preview.dataset.loaded = "1";

            preview.addEventListener("loadedmetadata", () => {
                preview.currentTime = Math.min(5, Math.max(0, preview.duration - 0.1));
                preview.play().catch(() => {});
            }, { once: true });
        } else {
            preview.currentTime = Math.min(5, Math.max(0, preview.duration - 0.1));
            preview.play().catch(() => {});
        }

        activePreview = preview;
    });

    card.addEventListener("mouseleave", () => {
        stopPreview(preview, true);
        if (activePreview === preview) {
            activePreview = null;
        }
    });

    grid.appendChild(card);
